[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W"]
# E501: long lines in docs/comments; E722/E741: pragmatic in bridge code
# E402: bl_info must precede imports in the Blender add-on
ignore = ["E501", "E722", "E741", "E402"]

[tool.ruff.lint.per-file-ignores]
# TouchDesigner injects op/me/parent/absTime/mod into module namespaces
"touchdesigner/*" = ["F821"]
